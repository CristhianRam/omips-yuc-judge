# Production docker-compose for Oracle VPS deployment.
# Usage: docker compose -f docker-compose.prod.yml up -d
#
# Requires a .env file in the same directory with:
#   POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD,
#   REDIS_PASSWORD, AUTH_SECRET, SECRET_KEY,
#   DATABASE_URL, ALGORITHM, ACCESS_TOKEN_EXPIRE_MINUTES

services:
  # ─── Reverse Proxy (ONLY public-facing service) ───
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - api
    restart: unless-stopped

  # ─── Frontend (internal only — no ports exposed) ───
  frontend:
    image: ghcr.io/${GHCR_OWNER:-your-username}/omips-frontend:latest
    environment:
      - AUTH_SECRET=${AUTH_SECRET}
      - AUTH_TRUST_HOST=true
    depends_on:
      - api
    restart: unless-stopped

  # ─── API (internal only — no ports exposed) ───
  api:
    image: ghcr.io/${GHCR_OWNER:-your-username}/omips-api:latest
    volumes:
      - problem_data:/data/problems
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=${ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      - TESTCASES_DIR=/data/problems
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  # ─── Worker (internal only — no ports exposed) ───
  worker:
    image: ghcr.io/${GHCR_OWNER:-your-username}/omips-worker:latest
    volumes:
      - problem_data:/data/problems
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=${ALGORITHM:-HS256}
      - TESTCASES_DIR=/data/problems
    depends_on:
      - redis
      - db
    restart: unless-stopped

  # ─── Database (internal only — invisible to the internet) ───
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    # No ports: section — DB is only reachable from other containers

  # ─── Redis (internal only — invisible to the internet) ───
  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    restart: unless-stopped
    # No ports: section — Redis is only reachable from other containers

volumes:
  problem_data:
  pgdata:
